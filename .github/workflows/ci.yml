# CI de testes/lint: roda a cada push e PR, dando o selo verde/vermelho.
# Checa sintaxe (compileall), estilo (ruff) e roda os testes (pytest).
name: CI

on:
  push:
  pull_request:

jobs:
  checagem:
    runs-on: ubuntu-latest
    steps:
      # Baixa o codigo do repositorio para a maquina do CI.
      - uses: actions/checkout@v4

      # Instala o Python (3.10, a versao minima que o projeto declara).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Instala o linter, as libs do projeto (os testes importam de src/) e
      # as dependencias de teste (pytest, em requirements-dev.txt).
      - name: Instalar dependencias
        run: |
          pip install ruff
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Compila todos os .py: falha se houver erro de sintaxe.
      - name: Checar sintaxe
        run: python -m compileall src

      # Linter: aponta erros e problemas de estilo no codigo.
      - name: Rodar o ruff
        run: ruff check src

      # Testes: roda a suite com e-mails ficticios (nenhum dado real).
      - name: Rodar os testes
        run: python -m pytest
